[package]
name = "ikopdf_shell"
version.workspace = true
edition.workspace = true
description = "iko PDF 변환 — 탐색기 우클릭 메뉴(IExplorerCommand) 확장"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]
